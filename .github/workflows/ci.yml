name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oracle group (moto, botocore) only installs on CPython with prebuilt wheels:
        # its comparisons run once, on the oldest supported version, and are skipped elsewhere.
        include:
          - python: "3.12"
            groups: --group test --group oracle
          - python: "3.15"
            groups: --group test
          - python: pypy3.12
            groups: --group test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked --no-default-groups ${{ matrix.groups }} pytest

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --locked --no-default-groups python -m scripts.record_golden
      - name: Recorded outputs match the committed ones
        run: |
          git status --porcelain -- tests/golden
          git diff --exit-code -- tests/golden
          test -z "$(git status --porcelain -- tests/golden)"
