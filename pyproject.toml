[project]
name = "s3-fast-exporter"
version = "0.1.0.dev0"
description = "Prometheus exporter for S3 buckets and objects, built for large buckets."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14",
    "prometheus-client>=0.26",
]

[project.optional-dependencies]
uvloop = ["uvloop>=0.23; sys_platform != 'win32' and platform_python_implementation == 'CPython'"]

[project.urls]
Source = "https://github.com/JaaJSoft/s3-fast-exporter"

[dependency-groups]
test = [
    "pytest>=8.4",
]
oracle = [
    "botocore>=1.44",
    "moto[server]>=5.2",
]
lint = [
    "mypy>=1.18",
    "ruff>=0.14",
    { include-group = "test" },
]
dev = [
    { include-group = "lint" },
    { include-group = "oracle" },
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exporter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "PERF",
    "PT", "S", "ERA", "TID", "PIE", "RET", "PTH",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310"]
"scripts/**" = ["S310", "S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["exporter", "fakes3", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["botocore.*", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
